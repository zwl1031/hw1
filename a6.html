<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星際守衛｜太空射擊</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(ellipse at top, #1b2d59, #070a18 70%); color: #eaf7ff; font-family: system-ui, sans-serif; }
        main { width: min(94vw, 700px); }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        h1 { margin: 0; color: #a9efff; letter-spacing: 3px; font-size: clamp(20px, 4vw, 28px); text-shadow: 0 0 14px #26cfff; }
        .stats { display: flex; gap: 20px; color: #bed5ed; } .stats b { color: white; font-size: 18px; }
        .arena { position: relative; border: 1px solid #507ca9; border-radius: 12px; overflow: hidden; box-shadow: 0 0 30px #1684b644; }
        canvas { display: block; width: 100%; height: min(68vh, 560px); min-height: 360px; background: #070b1b; }
        .overlay { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; text-align: center; padding: 20px; background: #05091bd9; }
        .overlay[hidden] { display: none; } .overlay h2 { color: #a9efff; font-size: 38px; margin: 0 0 8px; text-shadow: 0 0 15px #22cfff; }
        .overlay p { line-height: 1.7; color: #d5e5f7; }
        button { border: 1px solid #a4efff; border-radius: 30px; padding: 11px 28px; background: linear-gradient(110deg,#127ab4,#614ac4); color: white; font: inherit; font-weight: bold; cursor: pointer; }
        .help { text-align: center; color: #9db4d1; font-size: 13px; }
    </style>
</head>
<body>
    <main>
        <header><h1>✦ 星際守衛 ✦</h1><div class="stats">分數 <b id="score">0</b>　生命 <b id="lives">3</b></div></header>
        <section class="arena">
            <canvas id="game" aria-label="太空射擊遊戲"></canvas>
            <div class="overlay" id="overlay"><h2 id="title">準備出擊</h2><p id="message">駕駛戰機擊退外星艦隊！<br>方向鍵／WASD 移動，空白鍵射擊</p><button id="start">開始遊戲</button></div>
        </section>
        <p class="help">方向鍵或 WASD 移動　｜　空白鍵射擊　｜　遊戲內含音效</p>
    </main>
    <script>
    (() => {
        const canvas = document.querySelector('#game'), ctx = canvas.getContext('2d');
        const overlay = document.querySelector('#overlay'), scoreOut = document.querySelector('#score'), livesOut = document.querySelector('#lives');
        const keys = new Set(); let w, h, ship, shots, foes, stars, score, lives, active = false, last, spawn = 0, fire = 0, audio;
        function resize() {
            const r = canvas.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
            canvas.width = r.width * d; canvas.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0); w = r.width; h = r.height;
            if (!stars) stars = Array.from({length: 85}, () => ({x:Math.random()*w,y:Math.random()*h,s:20+Math.random()*60,r:Math.random()*1.7+.5}));
        }
        addEventListener('resize', resize); resize();
        function sound(freq, duration, type='sine', volume=.03) {
            if (!audio) return; const o=audio.createOscillator(), g=audio.createGain(); o.type=type; o.frequency.value=freq;
            o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*.45),audio.currentTime+duration); g.gain.setValueAtTime(volume,audio.currentTime);
            g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration); o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime+duration);
        }
        function start() {
            audio ||= new (window.AudioContext || window.webkitAudioContext)(); if(audio.state==='suspended') audio.resume();
            score=0; lives=3; shots=[]; foes=[]; ship={x:w/2,y:h-48,inv:0}; scoreOut.textContent=score; livesOut.textContent=lives;
            spawn=0; fire=0; last=performance.now(); active=true; overlay.hidden=true; sound(550,.14,'triangle'); requestAnimationFrame(loop);
        }
        document.querySelector('#start').onclick=start;
        addEventListener('keydown', e => { const k=e.key.toLowerCase(); if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault(); keys.add(k); if(!active&&k==='enter') start(); });
        addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
        function finish() {
            active=false; sound(150,.45,'sawtooth',.06); document.querySelector('#title').textContent='任務結束';
            document.querySelector('#message').innerHTML=`最終分數：${score}<br>再試一次，擊退更多敵人！`;
            document.querySelector('#start').textContent='再玩一次'; overlay.hidden=false;
        }
        function loop(now) { if(!active)return; const dt=Math.min((now-last)/1000,.04); last=now; update(dt); draw(); if(active)requestAnimationFrame(loop); }
        function update(dt) {
            for(const s of stars){s.y+=s.s*dt;if(s.y>h){s.y=0;s.x=Math.random()*w;}}
            ship.x+=((keys.has('arrowright')||keys.has('d'))-(keys.has('arrowleft')||keys.has('a')))*280*dt;
            ship.y+=((keys.has('arrowdown')||keys.has('s'))-(keys.has('arrowup')||keys.has('w')))*280*dt;
            ship.x=Math.max(18,Math.min(w-18,ship.x)); ship.y=Math.max(25,Math.min(h-25,ship.y)); ship.inv=Math.max(0,ship.inv-dt);
            fire-=dt; if((keys.has(' ')||keys.has('space'))&&fire<=0){shots.push({x:ship.x,y:ship.y-20});fire=.19;sound(700,.07,'square',.012);}
            spawn-=dt; if(spawn<=0){foes.push({x:22+Math.random()*(w-44),y:-20,s:75+Math.random()*60+score*.1,p:Math.random()*6});spawn=Math.max(.38,.9-score*.002);}
            shots.forEach(b=>b.y-=440*dt); shots=shots.filter(b=>b.y>-10);
            for(const f of foes){f.y+=f.s*dt;f.x+=Math.sin(f.y*.025+f.p)*24*dt;
                for(const b of shots)if(!b.dead&&Math.hypot(f.x-b.x,f.y-b.y)<20){b.dead=f.dead=true;score+=10;scoreOut.textContent=score;sound(260,.12,'triangle');}
                if(!f.dead&&ship.inv<=0&&Math.hypot(f.x-ship.x,f.y-ship.y)<27){f.dead=true;damage();}
                if(!f.dead&&f.y>h+18){f.dead=true;damage();}
                if(!active)return;
            }
            foes=foes.filter(f=>!f.dead); shots=shots.filter(b=>!b.dead);
        }
        function damage(){lives--;livesOut.textContent=lives;ship.inv=.85;sound(130,.28,'sawtooth',.05);if(lives<=0)finish();}
        function draw() {
            ctx.clearRect(0,0,w,h);ctx.fillStyle='#070b1b';ctx.fillRect(0,0,w,h);
            for(const s of stars){ctx.globalAlpha=.35+s.r/4;ctx.fillStyle='#d5edff';ctx.fillRect(s.x,s.y,s.r,s.r);}ctx.globalAlpha=1;
            for(const b of shots){ctx.shadowBlur=12;ctx.shadowColor='#61f6ff';ctx.fillStyle='#c5ffff';ctx.fillRect(b.x-2,b.y-9,4,13);}ctx.shadowBlur=0;
            for(const f of foes){ctx.save();ctx.translate(f.x,f.y);ctx.shadowBlur=12;ctx.shadowColor='#ff587b';ctx.fillStyle='#ff6484';ctx.beginPath();ctx.moveTo(-18,-5);ctx.lineTo(-10,-12);ctx.lineTo(0,-8);ctx.lineTo(10,-12);ctx.lineTo(18,-5);ctx.lineTo(12,7);ctx.lineTo(0,12);ctx.lineTo(-12,7);ctx.closePath();ctx.fill();ctx.restore();}
            if(ship&&(ship.inv<=0||Math.floor(performance.now()/90)%2===0)){ctx.save();ctx.translate(ship.x,ship.y);ctx.shadowBlur=16;ctx.shadowColor='#4ce6ff';ctx.fillStyle='#c7f7ff';ctx.beginPath();ctx.moveTo(0,-21);ctx.lineTo(16,15);ctx.lineTo(4,10);ctx.lineTo(0,15);ctx.lineTo(-4,10);ctx.lineTo(-16,15);ctx.closePath();ctx.fill();ctx.fillStyle='#ffb64a';ctx.beginPath();ctx.moveTo(-5,12);ctx.lineTo(0,24+Math.random()*7);ctx.lineTo(5,12);ctx.fill();ctx.restore();}
        }
    })();
    </script>
</body>
</html>
